services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: skating_coach
      POSTGRES_USER: skating_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MIGRATION_DB_PASSWORD: ${DB_MIGRATION_PASSWORD:?Set DB_MIGRATION_PASSWORD in .env}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - skating_db:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skating_admin -d skating_coach"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  skating_db:
